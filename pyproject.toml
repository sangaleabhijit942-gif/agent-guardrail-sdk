[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguardrail"
version = "0.1.0"
description = "Client SDK for Agent Guardrail — cost tracking and kill-switch protection for AI agents."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28"
]

[tool.setuptools.packages.find]
include = ["agentguardrail*"]